 было понятно?", "Что нет?", "С какого проекта начнёте?"], "one": true}], "n": 25}], "prompts": {"Промпт 1 с образцами": {"text": "Я собираю личный штаб исследователя: папку, из которой ты ведёшь мои проекты.\nНиже образцы AGENTS.md и карточки проекта. Сделай мои версии.\n1. Задавай вопросы по одному: как меня зовут, в какой команде я работаю, кто мой лид,\n   какие типы проектов я делаю чаще, как у нас называют проекты.\n   Ответы запиши в context/personal.md. Рядом создай context/corporate.md —\n   для фактов о компании в целом, пока пустой.\n2. Ничего не придумывай сверх моих ответов и образцов.\n3. AGENTS.md держи до 200 строк. Рядом создай CLAUDE.md с одной строкой:\n   «Правила штаба — в AGENTS.md. Прочитай его в начале каждой сессии и следуй ему».\n4. Создай папки по карте из AGENTS.md: context/, inbox/, processed/, methodology/,\n   projects/_template/ с README.md по образцу карточки, projects/_done/ и index.md в каждой папке,\n   кроме корня и inbox/: в projects/index.md — пустой список проектов.\n5. Сначала покажи файлы и дерево целиком и жди «ок».", "copy": "Я собираю личный штаб исследователя: папку, из которой ты ведёшь мои проекты.\nНиже образцы AGENTS.md и карточки проекта. Сделай мои версии.\n1. Задавай вопросы по одному: как меня зовут, в какой команде я работаю, кто мой лид,\n   какие типы проектов я делаю чаще, как у нас называют проекты.\n   Ответы запиши в context/personal.md. Рядом создай context/corporate.md —\n   для фактов о компании в целом, пока пустой.\n2. Ничего не придумывай сверх моих ответов и образцов.\n3. AGENTS.md держи до 200 строк. Рядом создай CLAUDE.md с одной строкой:\n   «Правила штаба — в AGENTS.md. Прочитай его в начале каждой сессии и следуй ему».\n4. Создай папки по карте из AGENTS.md: context/, inbox/, processed/, methodology/,\n   projects/_template/ с README.md по образцу карточки, projects/_done/ и index.md в каждой папке,\n   кроме корня и inbox/: в projects/index.md — пустой список проектов.\n5. Сначала покажи файлы и дерево целиком и жди «ок».\n\n==================== ОБРАЗЕЦ AGENTS.md ====================\n\n# AGENTS.md — штаб исследователя\n\nТы помогаешь мне вести исследовательские проекты. Кто я — в context/personal.md, о компании — в context/corporate.md.\n\n## Карта папки\n- projects/index.md — список живых проектов.\n- projects/<имя>/ — проект: README.md — карточка; 01-brief … 08-effect — стадии (с часика 2).\n- projects/_template/ — шаблон нового проекта. projects/_done/ — закрытые, без запроса не читать.\n- inbox/ — новые файлы. methodology/ — методологии и шаблоны.\n- context/ — контекст для тебя. personal.md — обо мне: кто я, мой лид и как утверждаю дизайн,\n  частые типы проектов, как называем проекты. corporate.md — о компании в целом:\n  структура, процессы, термины и сокращения, кто за что отвечает; не про проекты и не про меня.\n  Новое обо мне или о компании дописывай туда после моего «ок», новое про проект — в его карточку.\n- processed/ — оригиналы из inbox/ после разбора, как есть. Только хранить, в работе без запроса не открывать.\n- team-rules.md — наш процесс: стадии, артефакты, точки контроля (с часика 2).\n\n## index.md в каждой папке\nВ каждой папке, кроме корня, inbox/ и скрытых, лежит index.md — что в ней сейчас:\nпо строке на файл и подпапку: имя · что это · дата. projects/index.md — список проектов:\nимя, номер, как ещё называю, тип, где сейчас, следующий шаг, дедлайн.\n- Прежде чем открывать файлы в папке, прочитай её index.md. Ищи по нему, а не перебором.\n- Добавил, перенёс или переименовал файл или папку — в том же шаге обнови index.md\n  там, куда положил, и там, откуда забрал. Новая папка — сразу со своим index.md.\n- На каждом чекпоинте и по фразе «проверь индексы» сверь index.md с тем, что лежит\n  в папках, и почини расхождения.\n\n## Новые папки\n- Прошу создать папку — сначала спроси, по одному вопросу: как её назвать (латиницей), для чего она\n  и какие файлы туда будут попадать. Потом создай её с index.md, добавь в «Карту папки»\n  и покажи правку до сохранения.\n- Раз в неделю сверяй папки штаба с «Картой папки». Дата последней сверки — в строке «Сверка папок»\n  в конце этого файла. Нашёл папку, которой нет в карте, — спроси, что это за папка, и задай вопросы\n  из пункта выше. После ответов добавь её в карту и обнови дату сверки.\n\n## Методологии и шаблоны\nНужна методология или шаблон — сначала открой methodology/index.md. В нём описан каждый файл:\nчто это, для какого типа проекта или документа, когда брать. Бери файл по этому описанию,\nсверх него ничего не придумывай. Нужного нет — так и скажи.\nВзял методологию или шаблон — скажи одной строкой, какой файл. Тип проекта есть в карточке —\nсверься с _types.md, какие методы и шаблоны к нему подходят.\n\nДубли. Когда я добавляю методологию (через inbox/ или в methodology/)\nили пишу «проверь методологии»:\n1. Сравни её с остальными по сути, а не по названию: тот же метод, тот же тип проекта, похожие шаги.\n2. Нашёл пересечение — покажи таблицу: файлы · что совпадает · чем отличаются.\n3. Предложи, что сделать, и жди моего решения:\n   - моя правка к скачанной → оставить обе, в methodology/index.md главной отметить мою;\n   - две версии одного метода → слить в одну в methodology/, старые не удалять;\n   - разные методы с похожим названием → оставить обе, в methodology/index.md написать, когда какую брать.\n4. После решения обнови methodology/index.md.\n\n## Начало сессии\n1. Прочитай context/personal.md, context/corporate.md и projects/index.md (с часика 2 — и team-rules.md).\n2. Покажи живые проекты: имя, где сейчас, следующий шаг, дедлайн. Скажи, есть ли файлы в inbox/.\n3. Со сверки папок прошло 7 дней или больше — сверь папки, как написано в «Новые папки».\n4. Спроси, с каким проектом работаем.\n\n## Входящие\nПо фразе «разбери inbox»:\n1. Прочитай каждый файл в inbox/ и сделай из него .md-версию: Word и PDF переведи в текст,\n   .md и .txt скопируй. Оригинал не меняй.\n2. Определи, что это за файл — бриф, письмо, транскрипт встречи, дизайн, гайд, выгрузка, методология —\n   и к какому проекту из projects/index.md он относится. Методологию клади не в проект,\n   а в methodology/ — после проверки дублей.\n3. Чего не понял — спроси, по одному вопросу:\n   - это существующий проект или новый?\n   - новый — как его назвать? Предложи вариант из 2–3 слов по брифу, решаю я;\n   - есть ли у проекта номер?\n   - какой это тип проекта, если из файлов не ясно.\n   Остального не спрашивай: чего нет в файлах — в «Надо уточнить» с 🔍.\n4. Покажи таблицу «было → стало»: файл → новое имя латиницей → папка проекта. Жди «ок».\n5. После «ок»: новый проект заведи из projects/_template/, положи .md-версии в папку проекта,\n   оригиналы перенеси в processed/ и запиши в processed/index.md, что во что превратилось.\n   Заполни или обнови карточку, допиши строку в журнал карточки и в projects/index.md.\n6. Скажи, что изменилось в каждом проекте, и проверь, что inbox/ пуст.\n\n## Следующий шаг (с часика 2)\nНа «что дальше по <проекту>» сверь файлы проекта с артефактами из team-rules.md. Назови первую незакрытую стадию, чего не хватает, кто подтверждает и чем ты можешь помочь.\n\n## Чекпоинт\nСлово для сохранения: «чекпоинт».\nПо этому слову: обнови в карточке «где сейчас» и следующий шаг, допиши строку в журнал, обнови projects/index.md. С часика 2 — ещё стадию и пересборку dashboard.html. Скажи одной строкой, что записал.\nЕсли закончен шаг, в разговоре появилось то, чего нет в файлах, или я переключаюсь на другой проект, а слова не было, — предложи сохранить.\n\n## Правила\n- Только факты из файлов. Нет в файлах — так и скажи. Неясное помечай 🔍 и пиши в «Надо уточнить» карточки.\n- Имя проекта постоянное и выбираю его я. Номер не придумывай: есть — в начало имени папки, нет — работаем по имени.\n- Называю проект не так, как в projects/index.md, и ты не уверен, о каком речь, — переспроси,\n  не угадывай. Новое сокращение запиши в «как ещё называю».\n- Утверждение отмечай только по моей записи «утвердил кто, когда» или по письму в папке.\n- Имена файлов латиницей, содержимое по-русски, текст — в Markdown.\n- Ничего не удаляй. Перед переносом и переименованием показывай план.\n- Методологию бери из methodology/ по methodology/index.md. Прошлые проекты из _done/ — только по запросу и со ссылкой на файл.\n\n## Служебное\nСверка папок: ещё не было\n\n==================== ОБРАЗЕЦ КАРТОЧКИ: projects/_template/README.md ====================\n\n---\nимя:               # постоянное, не меняется\nномер:             # если проекты нумеруют; нет — пусто\nтип:               # юзабилити | глубинное интервью | switch-интервью | опрос | конкурентный анализ | исследование сегмента\nзаказчик:\nдедлайн:\nследующий_шаг:\nсвязка:            # другой проект того же исследования\nобновлено:\n---\n\n# <Постоянное имя> (номер, если есть)\n\n## Сценарий\n2–4 предложения: где живёт проблема, кто участники, что нужно понять, какое решение примут по итогам.\n\n## Где сейчас\nОдна-две фразы: что сделано, чего ждём.\n\n## Что проверяем\n1.\n\n## Надо уточнить\n- 🔍\n\n## Журнал\n| Дата | Что сделано | Что дальше |\n|---|---|---|\n", "where": "{{7|Слайд 7}}. Кнопка копирует файл целиком: промпт и образцы `AGENTS.md` и карточки проекта"}, "Новая папка": {"where": "{{5|Слайд 5}}. Когда в штабе нужна своя папка", "phHint": "Подсвечены места, которые нужно заменить своим.", "text": "Создай в штабе папку ⟪имя латиницей⟫/ для ⟪для чего она⟫.\nКласть туда буду ⟪какие файлы⟫.\nДобавь её в карту папки в AGENTS.md, заведи в ней index.md и покажи правку до сохранения."}, "Своё слово": {"where": "{{16|Слайд 16}}", "phHint": "Подсвечено место для вашего слова.", "text": "Хочу сохранять состояние проекта словом «⟪моё слово⟫» вместо «чекпоинт».\nПоменяй в AGENTS.md само слово и все места, где оно упоминается.\nЕсли это слово похоже на то, что я часто пишу в обычной работе, — предупреди.\nПокажи правку до сохранения и жди «ок»."}, "Промпт 2. Методологии": {"where": "{{22|Слайд 22}}. Перед ним файлы из Google-папки лежат в `inbox/`", "text": "Разбери inbox: там методологии и шаблоны, которые я скачал.\nПосле разбора собери methodology/index.md — описание всех методологий и шаблонов:\nпо строке на файл — что это, для какого типа проекта или документа, когда брать.\nПокажи methodology/index.md до сохранения."}, "Дизайн по методологии": {"where": "{{23|Слайд 23}}", "phHint": "Подсвечены места, которые нужно заменить своим.", "text": "Собери дизайн исследования по ⟪имя проекта⟫ по методологии ⟪глубинного интервью⟫.\nСначала открой methodology/index.md и скажи, какой файл берёшь.\nЧего не хватает в карточке проекта — спроси, не придумывай.\nПокажи дизайн до сохранения."}, "План отчёта": {"where": "{{23|Слайд 23}}", "phHint": "Подсвечено место, которое нужно заменить своим.", "text": "Разработай план финального отчёта по ⟪имя проекта⟫ по типичной структуре отчёта из methodology/.\nСкажи, какой файл взял. Покажи план до того, как писать отчёт."}, "Проверить AGENTS.md": {"where": "{{6|Слайд 6}}. По желанию, после шага 1", "text": "Прочитай AGENTS.md, сходи в свою документацию и скажи, всё ли в порядке с этим файлом."}}, "promise": ["Папка-штаб с правилами агента: новый чат подхватывает проект без пересказа", "Первый проект в штабе: карточка, журнал, своё слово сохранения", "Методологии из общей Google-папки, разобранные и описанные в одном файле"], "nopromise": ["Командного штаба и общего диска: сейчас каждый собирает свой", "Стадий проекта и дашборда — это часик 2", "Навыков на шагах процесса — это часик 3"], "series": {"h": "Три часика про штаб", "sub": "Каждый часик добавляет к штабу одно звено. На неделе повторяете на своих проектах.", "head": ["Часик", "Тема", "Что соберём", "На неделе"], "rows": [["1", "Память", "папка, правила агента, проекты с карточками, методологии", "«На чём остановились по …?»"], ["2", "Процесс", "стадии и точки контроля, проекты по стадиям, дашборд", "«Что у меня висит?»"], ["3", "Навыки", "ИИ на шагах процесса: подготовка к брифингу, свой навык", "ИИ на двух-трёх стадиях"]]
